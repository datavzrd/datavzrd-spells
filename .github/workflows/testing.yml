name: testing

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: '2.0.2-2' # any version from https://github.com/mamba-org/micromamba-releases
          environment-file: environment.yaml
          cache-environment: false # we always want the latest stable datavzrd
          post-cleanup: 'all'
      - name: Run tests
        shell: bash -el {0}
        run: |
          pytest -v
      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: test outputs
          path: test_outputs/
      - name: Prepare PR comment
        if: github.event_name == 'pull_request'
        run: |
          mkdir pr
          echo "The test reports of this PR can be downloaded [here](${{ steps.upload.outputs.artifact-url }})." > pr/${{ github.event.number }}.md
      - name: Upload PR comment
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr
          path: pr/

  deploy-examples:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test outputs
          path: test_outputs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: test_outputs/examples
      - id: deployment
        uses: actions/deploy-pages@v4
