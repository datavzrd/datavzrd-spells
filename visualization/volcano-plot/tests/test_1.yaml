name: DESeq2 results

datasets:
  results:
    path: airway_dex_shrunken.tsv
    links:
      gene.details:
        column: gene_id
        table-row: results/gene_id

views:
  results:
    dataset: results
    render-table:
      columns: {}
  volcano-plot:
    dataset: results
    spell:
      url: ../spell.yaml
      with:
        id_column: gene_id
        label_column: symbol
        label_genes: FKBP5,ZBTB16
        fold_change_column: log2FoldChange
        p_value_column: padj
        fold_change_threshold: 1
        link: gene.details
